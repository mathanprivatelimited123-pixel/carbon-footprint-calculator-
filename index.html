<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Footprint Calculator</title>
    <style>
        :root {
            --bg-color: #f0f4f1;
            --card-bg: #ffffff;
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --text-color: #333333;
            --text-light: #666666;
            --border-color: #cccccc;
            --accent-bg: #e8f5e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
        }

        .header-banner {
            background-color: var(--primary-color);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header-banner h1 {
            font-size: 26px;
            margin-top: 8px;
        }

        .header-banner p {
            font-size: 14px;
            opacity: 0.9;
        }

        .illustration {
            width: 70px;
            height: 70px;
            margin: 0 auto;
        }

        .form-body {
            padding: 25px;
        }

        .section-title {
            font-size: 16px;
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-bg);
            padding-bottom: 5px;
            margin: 20px 0 15px 0;
            font-weight: 700;
        }

        .section-title:first-of-type {
            margin-top: 0;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            background-color: #fafafa;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary-color);
            background-color: #fff;
        }

        .input-wrapper input, .input-wrapper select {
            border: none;
            outline: none;
            width: 100%;
            font-size: 15px;
            background: transparent;
        }

        .unit-tag {
            font-size: 13px;
            color: var(--text-light);
            font-weight: bold;
            margin-left: 5px;
            white-space: nowrap;
        }

        .btn-calculate {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 15px;
        }

        .btn-calculate:hover {
            background-color: var(--primary-hover);
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: var(--accent-bg);
            border-radius: 6px;
            border-left: 5px solid var(--primary-color);
            display: block;
            text-align: center;
        }

        .result-box h2 {
            font-size: 16px;
            color: var(--primary-hover);
            margin-bottom: 5px;
        }

        .score {
            font-size: 36px;
            font-weight: 800;
            color: #1b5e20;
        }

        .score span {
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <div class="header-banner">
        <div class="illustration">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" fill="#a5d6a7" />
                <path d="M50 15C33.43 15 20 28.43 20 45C20 61.57 50 85 50 85C50 85 80 61.57 80 45C80 28.43 66.57 15 50 15ZM45 60L32 47L36.24 42.76L45 51.52L63.76 32.76L68 37L45 60Z" fill="#1b5e20"/>
            </svg>
        </div>
        <h1>Full Carbon Footprint Calculator</h1>
        <p>Analyze your household, travel, diet, and waste impact</p>
    </div>

    <div class="form-body">
        <form id="calcForm" onsubmit="event.preventDefault(); calculateAdvancedFootprint();">
            <!-- Section 1: Home Utilities & Transit -->
            <div class="section-title">Utilities & Transit</div>
            <div class="input-row">
                <div class="input-group">
                    <label for="electricity">Electricity</label>
                    <div class="input-wrapper">
                        <input type="number" id="electricity" min="0" value="0">
                        <span class="unit-tag">kWh/mo</span>
                    </div>
                </div>
                <div class="input-group">
                    <label for="gas">Natural Gas</label>
                    <div class="input-wrapper">
                        <input type="number" id="gas" min="0" value="0">
                        <span class="unit-tag">Therm/mo</span>
                    </div>
                </div>
            </div>
            <div class="input-group">
                <label for="transport">Car Driving Distance</label>
                <div class="input-wrapper">
                    <input type="number" id="transport" min="0" value="0">
                    <span class="unit-tag">km / month</span>
                </div>
            </div>

            <!-- Section 2: Flights -->
            <div class="section-title">Air Travel</div>
            <div class="input-row">
                <div class="input-group">
                    <label for="shortFlights">Short Haul (&lt; 3 hours)</label>
                    <div class="input-wrapper">
                        <input type="number" id="shortFlights" min="0" value="0">
                        <span class="unit-tag">flights/yr</span>
                    </div>
                </div>
                <div class="input-group">
                    <label for="longFlights">Long Haul (&gt; 3 hours)</label>
                    <div class="input-wrapper">
                        <input type="number" id="longFlights" min="0" value="0">
                        <span class="unit-tag">flights/yr</span>
                    </div>
                </div>
            </div>

            <!-- Section 3: Diet & Waste Management -->
            <div class="section-title">Lifestyle & Waste</div>
            <div class="input-row">
                <div class="input-group">
                    <label for="diet">Primary Diet Style</label>
                    <div class="input-wrapper">
                        <select id="diet">
                            <option value="heavyMeat">Heavy Meat Eater</option>
                            <option value="average" selected>Medium Meat Eater</option>
                            <option value="vegetarian">Vegetarian</option>
                            <option value="vegan">Vegan</option>
                        </select>
                    </div>
                </div>
                <div class="input-group">
                    <label for="waste">Recycling Habits</label>
                    <div class="input-wrapper">
                        <select id="waste">
                            <option value="none">No Recycling</option>
                            <option value="partial" selected>Recycle Metal/Glass</option>
                            <option value="full">Recycle Paper/Metal/Glass</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-calculate">Compute Total Footprint</button>
        </form>

        <div class="result-box" id="resultBox">
            <h2>Your Annual Net Carbon Footprint</h2>
            <div class="score" id="totalEmission">2.78 <span>Metric Tons CO₂e / year</span></div>
        </div>
    </div>
</div>

<script>
    function calculateAdvancedFootprint() {
        const electricityAn = (parseFloat(document.getElementById('electricity').value) || 0) * 12;
        const gasAn = (parseFloat(document.getElementById('gas').value) || 0) * 12;
        const transportAn = (parseFloat(document.getElementById('transport').value) || 0) * 12;

        const shortFlights = parseFloat(document.getElementById('shortFlights').value) || 0;
        const longFlights = parseFloat(document.getElementById('longFlights').value) || 0;

        const electricityFactor = 0.45; 
        const gasFactor = 5.3;         
        const transportFactor = 0.18;   
        
        const shortFlightFactor = 220; 
        const longFlightFactor = 1100; 

        const dietOptions = { heavyMeat: 2900, average: 2000, vegetarian: 1300, vegan: 900 };
        const wasteCredits = { none: 0, partial: -120, full: -250 };

        const chosenDiet = document.getElementById('diet').value;
        const chosenWaste = document.getElementById('waste').value;

        let totalKg = (electricityAn * electricityFactor) +
                      (gasAn * gasFactor) +
                      (transportAn * transportFactor) +
                      (shortFlights * shortFlightFactor) +
                      (longFlights * longFlightFactor) +
                      dietOptions[chosenDiet] +
                      wasteCredits[chosenWaste];

        if (totalKg < 0) totalKg = 0;

        const totalTons = totalKg / 1000;
        const totalDisplay = document.getElementById('totalEmission');
        totalDisplay.innerHTML = totalTons.toFixed(2) + ' <span>Metric Tons CO₂e / year</span>';
    }
</script>

</body>
</html>
